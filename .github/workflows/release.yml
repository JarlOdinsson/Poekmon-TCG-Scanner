name: Signed Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate repository and catalogue
        run: |
          python tools/check_repository.py
          python -m unittest discover -s tools/catalog-builder -p 'test_*.py'
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CARDEX_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carddex-release.jks"
      - name: Build signed, minimized app bundle
        working-directory: android
        env:
          CARDEX_KEYSTORE_PATH: ${{ runner.temp }}/carddex-release.jks
          CARDEX_KEYSTORE_PASSWORD: ${{ secrets.CARDEX_KEYSTORE_PASSWORD }}
          CARDEX_KEY_ALIAS: ${{ secrets.CARDEX_KEY_ALIAS }}
          CARDEX_KEY_PASSWORD: ${{ secrets.CARDEX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: carddex-signed-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            tools/catalog-builder/output/catalog-en-v2.bundle.zip
            tools/catalog-builder/output/catalog-en-v2.bundle.zip.sha256
