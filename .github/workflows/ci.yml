name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Reject oversized tracked files
        run: python tools/check_repository.py
      - name: Validate catalogue artifacts
        run: python -m unittest discover -s tools/catalog-builder -p 'test_*.py'
      - name: Test and build Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: carddex-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
