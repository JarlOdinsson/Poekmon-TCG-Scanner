apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

def releaseKeystorePath = System.getenv('CARDEX_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('CARDEX_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CARDEX_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CARDEX_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'com.pokemontcgscanner.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pokemontcgscanner.app'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('CARDEX_VERSION_CODE') ?: '2')
        versionName System.getenv('CARDEX_VERSION_NAME') ?: '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString(), 'room.incremental': 'true']
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

gradle.taskGraph.whenReady { graph ->
    def requestsReleaseArtifact = graph.allTasks.any { task ->
        task.project == project && (task.name == 'assembleRelease' || task.name == 'bundleRelease')
    }
    if (requestsReleaseArtifact && !hasReleaseSigning) {
        throw new GradleException('Release signing is required. Set CARDEX_KEYSTORE_PATH, CARDEX_KEYSTORE_PASSWORD, CARDEX_KEY_ALIAS, and CARDEX_KEY_PASSWORD.')
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

kapt { correctErrorTypes true }
